# ===================================================================
# Python FastAPI 테스트 + 빌드 검증 워크플로우 (CI Only)
# ===================================================================
#
# 설명:
# - main 브랜치에 push 시 pytest 실행 + Docker 빌드가 정상적으로 되는지 검증
# - 배포는 수행하지 않음 (deploy 브랜치에서만 배포)
#
# ⚠️ 테스트 잡에는 운영 .env를 주입하지 않는다.
#    conftest.py가 drop_all/create_all을 수행하므로 운영 DB 주소가 들어가면
#    데이터가 전멸한다. 테스트 잡은 서비스 컨테이너(PostgreSQL)만 바라본다.
#
# ===================================================================

name: PROJECT-PYTHON-CI

# ===================================================================
# 트리거 설정
# ===================================================================
on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
  workflow_dispatch:

# ===================================================================
# 환경 변수 설정
# ===================================================================
env:
  # 프로젝트 고유 식별자 (컨테이너명, 이미지명, 도메인에 사용)
  PROJECT_NAME: "pickerpicker-back"

  # 🐍 Python 설정
  PYTHON_VERSION: "3.13"

jobs:
  # ===================================================================
  # 테스트 작업 — 격리된 PostgreSQL 컨테이너 사용
  # ===================================================================
  test:
    name: Python 테스트 (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_pickerpicker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1. 소스코드 체크아웃
      - name: 코드 체크아웃
        uses: actions/checkout@v5

      # 2. Python 설정
      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # 3. 의존성 설치 (test extras 포함)
      # pyproject.toml을 단일 진실 소스로 사용 (Dockerfile과 동일한 방식).
      # 패키지 설치(-e .) 대신 경로 기반으로 쓴다 — setuptools의 src-layout 자동 탐색이
      # `src.` 접두사를 없애버려 `from src.core...` import가 깨지기 때문.
      - name: 의존성 설치
        working-directory: ./backend
        run: |
          echo "📦 의존성 설치 중..."
          python -m pip install --upgrade pip uv
          uv pip install --system -r pyproject.toml --extra test
          echo "✅ 의존성 설치 완료"

      # 4. pytest 실행
      # DATABASE_URL / TEST_DATABASE_URL 모두 서비스 컨테이너를 가리킨다.
      # 운영 secrets는 이 잡에 주입하지 않는다 (drop_all 사고 방지).
      - name: pytest 실행
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_pickerpicker
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_pickerpicker
          ENVIRONMENT: dev
          SECRET_KEY: ci-test-secret
        run: |
          echo "🧪 테스트 실행..."
          pytest -v --tb=short
          echo "✅ 테스트 통과"

  # ===================================================================
  # 빌드 검증 작업
  # ===================================================================
  build-check:
    name: Python FastAPI 빌드 검증
    runs-on: ubuntu-latest
    needs: test

    steps:
      # 1. 소스코드 체크아웃
      - name: 코드 체크아웃
        uses: actions/checkout@v5

      # 2. .env 파일 생성 (빌드 검증용)
      # secrets를 heredoc 안에 직접 넣으면 YAML 파서 오류가 발생하므로
      # env로 받아 셸 변수로 참조한다 (CLAUDE.md 규칙).
      - name: .env 파일 생성
        env:
          BACKEND_ENV_FILE: ${{ secrets.BACKEND_ENV_FILE }}
        run: |
          printf '%s\n' "$BACKEND_ENV_FILE" > backend/.env
          echo "✅ .env 파일이 생성되었습니다"

      # 3. Docker 빌드 환경 설정
      - name: Docker 빌드환경 설정
        uses: docker/setup-buildx-action@v3

      # 4. Docker 이미지 빌드 (push 없이 검증만)
      - name: Docker 이미지 빌드 검증
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false  # 푸시하지 않음 (빌드 검증만)
          tags: ${{ env.PROJECT_NAME }}:build-check
          # GitHub Actions 캐시 사용
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5. 빌드 성공 메시지
      - name: 빌드 검증 완료
        run: |
          echo "✅ Docker 빌드 검증이 성공적으로 완료되었습니다!"
          echo ""
          echo "📋 빌드 정보:"
          echo "  🎯 프로젝트: ${{ env.PROJECT_NAME }}"
          echo "  🌿 브랜치: ${{ github.ref_name }}"
          echo "  📝 커밋: ${{ github.sha }}"
          echo "  ⏰ 검증 시간: $(date '+%Y-%m-%d %H:%M:%S')"
