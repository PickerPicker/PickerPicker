[project]
name = "pickerpicker-backend"
version = "0.1.0"
description = "PickerPicker 게임 백엔드 API 서버"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "asyncpg>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.14.0",
    "python-dotenv>=1.0.0",
    "bcrypt>=4.2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# backend/ 를 import 경로에 추가 — 테스트가 `from src.core...` 형태로 import한다.
# (setuptools의 src-layout 자동 탐색을 쓰면 `src.` 접두사가 깨지므로 설치 대신 경로로 해결)
pythonpath = ["."]
asyncio_mode = "strict"
