server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 보안 헤더
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 게임에서 쓰지 않는 브라우저 기능은 차단
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # 해시가 붙은 정적 자산 — 내용이 바뀌면 파일명도 바뀌므로 영구 캐시해도 안전
    # (nginx는 location 블록 안에 add_header가 있으면 상위 헤더를 상속하지 않아 재선언한다)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        try_files $uri =404;
    }

    # index.html은 캐시하지 않는다.
    # 캐시된 옛 index.html이 새 배포의 해시 자산을 참조하면 404 → 흰 화면이 된다.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # React SPA — 모든 경로를 index.html로
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        image/svg+xml;
}
